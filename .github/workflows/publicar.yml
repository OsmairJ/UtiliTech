# Gera o UtiliTech.exe e publica uma release a cada tag de versão (ex.: git tag v0.2.0 && git push --tags).
# O app procura atualização na release mais recente deste repositório e só instala se o SHA-256 conferir.
name: Publicar

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Rodar os testes
        run: dotnet test UtiliTech.Tests -c Release

      - name: Compilar o .exe único
        shell: pwsh
        run: |
          $versao = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish UtiliTech.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:Version=$versao -o dist

      - name: Calcular o SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/UtiliTech.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  UtiliTech.exe" | Out-File dist/UtiliTech.exe.sha256 -Encoding ascii -NoNewline
          Write-Host "SHA-256: $hash"

      - name: Notas da versão (seção do NOVIDADES.md)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $md = Get-Content NOVIDADES.md -Raw -Encoding utf8
          $m = [regex]::Match($md, "(?ms)^##\s+$([regex]::Escape($tag))\b.*?(?=^##\s|\z)")
          if (-not $m.Success) { throw "NOVIDADES.md não tem a seção ${tag}: escreva as novidades antes de lançar a versão." }
          $m.Value.Trim() | Out-File notas.md -Encoding utf8
          Get-Content notas.md

      - name: Publicar a release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/UtiliTech.exe
            dist/UtiliTech.exe.sha256
          body_path: notas.md
